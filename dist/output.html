<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<title>Thigazh — Output</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0e16; }
  #log {
    box-sizing: border-box;
    width: 100%; height: 100%;
    margin: 0; padding: 16px;
    color: #e2e8f0;
    font-family: 'Cascadia Mono', 'Consolas', monospace;
    font-size: 13px; line-height: 1.6;
    white-space: pre-wrap;
    overflow-y: auto;
  }
</style>
</head>
<body>
<pre id="log">Ready.</pre>
<script>
  async function refreshLog() {
    try {
      const invoke = window.__TAURI__.invoke;
      const text = await invoke('get_last_output');
      const el = document.getElementById('log');
      el.textContent = text;
      el.scrollTop = el.scrollHeight;
    } catch (e) {
      document.getElementById('log').textContent = 'Error loading output: ' + e;
    }
  }
  window.refreshLog = refreshLog;
  refreshLog();
</script>
</body>
</html>
